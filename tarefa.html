<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To do List</title>
    <style>* {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
    }
    ul{
        display: flex;
        justify-content: center;
        align-items: center;
        text-decoration: none;
    }
    .meubotao {
        width: 300px;
        border: none;
        padding: 8px;
        background-color:#B7410E;
        cursor: pointer;
        color: #fff;
        font-weight: 900;
        display: block;
        margin-left: auto;
        margin-right: auto;
        margin-top: 15px;
        border-radius: 10px;
    }
    .remove{
        height:15px;
        background-color: transparent;
        cursor: pointer;
        border: none;
        display: flex;
        justify-content: right;
        opacity: 1;
    }
    .remove:hover{
        opacity: 0.7;
        transition: 0.5s;
    }
    .meubotao:hover{
        background-color: #722F37;
        transition: 0.3s ease-out;
        transform: scale(1.1);
    }
    li {
        background-color: #fff;
        width:500px;
        height:30px;
        margin-top:40px;
        border-radius:5px;
        display: flex;
        justify-content: space-between;
        text-align: center;
        padding: 5px;
        border: 2px solid #FFA07A;
        box-shadow: 0px 2px 26px 13px rgba(0,0,0,0.75);
    }
    input {
        margin-top: 10px;
        width:550px;
        padding: 8px;
        outline: none;
        border: none;
        border-radius: 5px;
        display: block;
        margin-left: auto;
        margin-right: auto;
    }
    body {
        background:#58111A;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }
    .conteiner:hover{
        transform: scale(1.1);
    }
    .conteiner {
        display: flex;
        flex-direction: column;
        width: 650px;
        border-radius: 20px;
        border: 2px solid #FFA07A;
        margin-top: 50px;
        padding: 20px;
        box-shadow: 0px 2px 26px 13px rgba(0,0,0,0.75);
    }
    h1,p {
        text-align: center;
        color: #fff;
        font-weight: 900;
    }
    footer {
        color: #fff;
        font-weight: 800;
        margin-top: 20px;
    }
    </style>
</head>
<body>
    <div class="conteiner">
        <h1>Lista de Tarefa do Natan</h1>
        <p>Esse projeto tem como finalidade de aprofundar mais sobre o Javascript...!
            Linguagem de programação interessante para estudos e aperfeiçoamento!
        </p>
        <input type="text" id="input" placeholder="Digite sua Tarefa...">
        <button class="meubotao" id="Button">Adicionar:</button>
        <ul id="task-list">
        </ul>
    </div>
    <script src="scripts.js"></script>
    <footer>
        &copy; Feito por Natanrcs
    </footer>
</body>
</html>
